services:
  - type: web
    name: ravencode-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SERVICE_URL
        fromService:
          name: ravencode-ai
          type: web
          property: host
      - key: DATABASE_URL
        value: ./database/ravencode.db

  - type: web
    name: ravencode-ai
    env: python
    region: oregon
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
